[package]
name = "sentinelforge-detection"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Sigma rule parsing and matching for SentinelForge events"

[dependencies]
async-nats = "0.51"
futures-util = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
thiserror = "2"
