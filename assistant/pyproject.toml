[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelforge-assistant"
version = "0.1.0"
description = "Read-only, evidence-grounded investigation assistant for SentinelForge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.26"]

[project.scripts]
sentinelforge-assistant = "sentinelforge_assistant.server:main"

[tool.setuptools.packages.find]
where = ["src"]
